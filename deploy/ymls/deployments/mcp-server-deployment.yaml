apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:

      containers:
        - name: mcp-server
          image: docker.io/jeetulsamaiya1/portfolio:mcp-server-main-015
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi


